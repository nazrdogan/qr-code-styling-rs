[package]
name = "qr-code-styling"
version = "0.2.1"
edition = "2021"
authors = ["Nazir Dogan <nazrdogan@gmail.com>"]
description = "Styled QR code generation with customizable dots, corners, gradients, and logo embedding"
license = "MIT"
keywords = ["qr", "qrcode", "svg", "styling"]
categories = ["encoding", "graphics"]
repository = "https://github.com/nazrdogan/qr-code-styling-rs"
homepage = "https://github.com/nazrdogan/qr-code-styling-rs"
documentation = "https://docs.rs/qr-code-styling"
readme = "README.md"
exclude = [".claude", "*.svg", "*.pdf", "*.png", "*.jpg", "*.webp", "!examples/logo.png"]

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["lib"]

[dependencies]
qrcode = "0.14"
thiserror = "2.0"
base64 = "0.22"

# Image processing (raster encoders are enabled by the png/jpeg/webp features)
image = { version = "0.25", default-features = false }

# SVG parsing/rasterizing (must share the usvg version used by svg2pdf)
usvg = { version = "0.45", optional = true }
resvg = { version = "0.45", optional = true }

# PDF generation (SVG to PDF vector conversion)
svg2pdf = { version = "0.13", optional = true }

# Native CMYK PDF output (optional)
pdf-writer = { version = "0.12", optional = true }
miniz_oxide = { version = "0.8", optional = true }

# Optional serde support
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.5"
lopdf = "0.34"
rayon = "1.10"

[features]
default = ["png", "jpeg", "webp", "pdf"]
pdf = ["dep:svg2pdf", "dep:usvg"]
cmyk = ["dep:pdf-writer", "dep:miniz_oxide"]
serde = ["dep:serde"]
# Rasterizing SVG (enabled by any raster format)
raster = ["dep:resvg", "dep:usvg"]
png = ["raster", "image/png"]
jpeg = ["raster", "image/jpeg"]
webp = ["raster", "image/webp"]

[[example]]
name = "basic"
required-features = ["png", "pdf"]

[[example]]
name = "with_logo"
required-features = ["png"]

[[example]]
name = "generate_samples"
required-features = ["png"]

[[example]]
name = "with_border"
required-features = ["pdf"]

[[example]]
name = "cmyk_pdf"
required-features = ["cmyk"]

[[example]]
name = "cmyk_sheet"
required-features = ["cmyk"]

[[example]]
name = "bulk_pdf"
required-features = ["pdf", "png"]

[[bench]]
name = "render"
harness = false
required-features = ["png", "pdf"]

[profile.release]
lto = true
opt-level = 3
