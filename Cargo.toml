[package]
name = "qr-code-styling"
version = "0.1.1"
edition = "2021"
authors = ["Nazir Dogan <nazrdogan@gmail.com>"]
description = "Styled QR code generation with customizable dots, corners, gradients, and logo embedding"
license = "MIT"
keywords = ["qr", "qrcode", "svg", "styling"]
categories = ["encoding", "graphics"]
repository = "https://github.com/nazrdogan/qr-code-styling-rs"
homepage = "https://github.com/nazrdogan/qr-code-styling-rs"
documentation = "https://docs.rs/qr-code-styling"
readme = "README.md"
exclude = ["*.svg", "*.pdf", "*.png", "*.jpg", "*.webp", "!examples/logo.png"]

[lib]
crate-type = ["lib"]

[dependencies]
qrcode = "0.14"
thiserror = "2.0"
base64 = "0.22"

# Image processing (raster encoders are enabled by the png/jpeg/webp features)
image = { version = "0.25", default-features = false }

# SVG rendering (must share the usvg version used by svg2pdf)
resvg = "0.45"

# PDF generation (SVG to PDF vector conversion)
svg2pdf = { version = "0.13", optional = true }

# Optional serde support
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.5"
lopdf = "0.34"
rayon = "1.10"

[features]
default = ["png", "jpeg", "webp", "pdf"]
pdf = ["dep:svg2pdf"]
serde = ["dep:serde"]
png = ["image/png"]
jpeg = ["image/jpeg"]
webp = ["image/webp"]

[[example]]
name = "with_border"
required-features = ["pdf"]

[[example]]
name = "bulk_pdf"
required-features = ["pdf"]

[[bench]]
name = "render"
harness = false

[profile.release]
lto = true
opt-level = 3
